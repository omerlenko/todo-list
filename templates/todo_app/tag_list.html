{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fs-1 mb-0">Tags</h1>
    <a href="{% url "todo_app:tag-create" %}" class="btn btn-primary btn-sm fs-5">Add Tag</a>
  </div>
  <table class="table table-hover">
    <thead>
      <tr>
        <th scope="col" class="fs-5">Name</th>
        <th scope="col" class="fs-5">Update</th>
        <th scope="col" class="fs-5">Delete</th>
      </tr>
    </thead>
    <tbody>
      {% for tag in tags %}
      <tr>
        <td class="fs-5">{{ tag.name }}</td>
        <td>
          <a href="{% url "todo_app:tag-update" pk=tag.id %}" class="btn btn-primary btn-sm">Update</a>
        </td>
        <td>
          <a href="{% url "todo_app:tag-delete" pk=tag.id %}" class="btn btn-danger btn-sm">Delete</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
